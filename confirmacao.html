<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris | Confirmar Plano</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .confirm-container { padding: 120px 10%; text-align: center; min-height: 80vh; }
        .price-tag { font-size: 3.5rem; color: #facc15; margin: 30px 0; font-weight: bold; text-shadow: 0 0 20px rgba(250, 204, 21, 0.3); }
        .contact-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid #facc15; display: inline-block; margin-top: 20px; backdrop-filter: blur(10px); }
        .btn-back { display: inline-block; margin-top: 40px; color: #94a3b8; text-decoration: none; border-bottom: 1px solid #94a3b8; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">SOLARIS<span>.</span></div>
        </nav>
    </header>

    <section class="confirm-container">
        <h1 id="plano-nome" style="font-size: 2.5rem;">Carregando...</h1>
        <p style="color: #94a3b8; font-size: 1.2rem;">O investimento estimado para o seu projeto é de:</p>
        <div class="price-tag" id="plano-preco">--</div>
        
        <div class="contact-box">
            <h3>Falar com um Consultor</h3>
            <p style="margin-bottom: 15px;">Inicie o seu projeto agora pelo WhatsApp:</p>
            <a href="https://wa.me/5554999999999" target="_blank" style="color: #facc15; font-size: 1.5rem; text-decoration: none; font-weight: bold;">+55 (54) 99999-9999</a>
        </div>
        <br>
        <a href="index.html" class="btn-back">Voltar para a página principal</a>
    </section>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const plano = urlParams.get('plano');
        
        const info = {
            'home': { nome: 'Solaris Home', preco: 'R$ 14.500' },
            'agro': { nome: 'Solaris Agro', preco: 'R$ 52.000' },
            'business': { nome: 'Solaris Business', preco: 'R$ 98.000' }
        };

        if(info[plano]) {
            document.getElementById('plano-nome').innerText = info[plano].nome;
            document.getElementById('plano-preco').innerText = info[plano].preco;
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
